<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Test Modal Issue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Test Modal Reschedule</h1>
        
        <button class="btn btn-primary" onclick="testOpenModal()">Test Open Reschedule Modal</button>
        
        <!-- View Appointment Modal -->
        <div class="modal fade" id="viewAppointmentModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Chi tiết lịch hẹn</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <p>Test content</p>
                    </div>
                    <div class="modal-footer" id="viewAppointmentActions">
                        <!-- Buttons will be inserted here -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Reschedule Appointment Modal -->
        <div class="modal fade" id="rescheduleModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i class="fas fa-calendar-alt me-2"></i>Thay đổi lịch hẹn
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="rescheduleForm">
                            <input type="hidden" id="rescheduleAppointmentId">
                            
                            <div class="mb-3">
                                <label class="form-label">Ngày khám mới</label>
                                <input type="date" class="form-control" id="rescheduleDate" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Giờ bắt đầu</label>
                                    <input type="time" class="form-control" id="rescheduleStartTime" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Giờ kết thúc</label>
                                    <input type="time" class="form-control" id="rescheduleEndTime" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Lý do thay đổi</label>
                                <textarea class="form-control" id="rescheduleReason" rows="3" required></textarea>
                            </div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                        <button type="button" class="btn btn-primary" onclick="alert('Save clicked')">
                            Xác nhận thay đổi
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let viewAppointmentModal, rescheduleModal;

        // Initialize modals
        document.addEventListener('DOMContentLoaded', function() {
            viewAppointmentModal = new bootstrap.Modal(document.getElementById('viewAppointmentModal'));
            rescheduleModal = new bootstrap.Modal(document.getElementById('rescheduleModal'));
        });

        function testOpenModal() {
            console.log('testOpenModal called');
            
            // Simulate button creation like in real app
            const actions = `
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-info" onclick="openRescheduleModal(123, '2025-10-24T10:00:00', '2025-10-24T11:00:00')">
                    <i class="fas fa-calendar-alt me-2"></i>Thay đổi lịch
                </button>
            `;
            
            document.getElementById('viewAppointmentActions').innerHTML = actions;
            
            // Show view modal
            viewAppointmentModal.show();
        }

        function openRescheduleModal(appointmentId, currentStart, currentEnd) {
            console.log('openRescheduleModal called:', { appointmentId, currentStart, currentEnd });
            
            // Parse dates
            const startDate = new Date(currentStart);
            const endDate = new Date(currentEnd);
            
            // Format date
            const year = startDate.getFullYear();
            const month = String(startDate.getMonth() + 1).padStart(2, '0');
            const day = String(startDate.getDate()).padStart(2, '0');
            const dateString = `${year}-${month}-${day}`;
            
            // Format time
            const startHours = String(startDate.getHours()).padStart(2, '0');
            const startMinutes = String(startDate.getMinutes()).padStart(2, '0');
            const startTimeString = `${startHours}:${startMinutes}`;
            
            const endHours = String(endDate.getHours()).padStart(2, '0');
            const endMinutes = String(endDate.getMinutes()).padStart(2, '0');
            const endTimeString = `${endHours}:${endMinutes}`;
            
            console.log('Parsed values:', { dateString, startTimeString, endTimeString });
            
            // Set form values
            document.getElementById('rescheduleAppointmentId').value = appointmentId;
            document.getElementById('rescheduleDate').value = dateString;
            document.getElementById('rescheduleStartTime').value = startTimeString;
            document.getElementById('rescheduleEndTime').value = endTimeString;
            
            // Hide view modal
            console.log('Hiding view modal...');
            if (window.viewAppointmentModal) {
                viewAppointmentModal.hide();
            }
            
            // Show reschedule modal after delay
            console.log('Showing reschedule modal...');
            setTimeout(() => {
                rescheduleModal.show();
                console.log('Reschedule modal shown');
            }, 300);
        }
    </script>
</body>
</html>
