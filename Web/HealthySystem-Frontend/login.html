<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - HealthySystem</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            padding: 20px;
        }
        
        .login-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .login-header h1 {
            color: var(--primary-color);
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .login-header p {
            color: #666;
            font-size: 16px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
        }
        
        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-bottom: 20px;
        }
        
        .btn-login:hover {
            background: #5a6fd8;
        }
        
        .btn-login:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .login-footer {
            text-align: center;
            margin-top: 20px;
        }
        
        .login-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }
        
        .login-footer a:hover {
            text-decoration: underline;
        }
        
        .back-to-home {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        
        .back-to-home:hover {
            background: rgba(255,255,255,0.3);
            color: white;
        }
        
        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
        
        .success-message {
            background: #efe;
            color: #363;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <a href="index.html" class="back-to-home">← Về trang chủ</a>
        
        <div class="login-card">
            <div class="login-header">
                <h1>🏥 HealthySystem</h1>
                <p>Đăng nhập để truy cập hệ thống</p>
            </div>
            
            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>
            
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">Email:</label>
                    <input type="email" id="email" name="email" class="form-control" required placeholder="Nhập email của bạn">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Mật khẩu:</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Nhập mật khẩu">
                </div>
                
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="remember-me"> Ghi nhớ đăng nhập
                    </label>
                </div>
                
                <button type="submit" id="login-btn" class="btn-login">
                    Đăng nhập
                </button>
            </form>
            
            <div class="login-footer">
                <p>Chưa có tài khoản? <a href="#" id="register-link">Đăng ký ngay</a></p>
                <p><a href="#" id="forgot-password-link">Quên mật khẩu?</a></p>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('login-form');
            const loginBtn = document.getElementById('login-btn');
            const errorMessage = document.getElementById('error-message');
            const successMessage = document.getElementById('success-message');
            
            // Kiểm tra nếu đã đăng nhập
            if (authManager.isAuthenticated()) {
                window.location.href = 'index.html';
                return;
            }
            
            // Xử lý form đăng nhập
            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                // Disable nút và hiển thị loading
                loginBtn.disabled = true;
                loginBtn.textContent = 'Đang đăng nhập...';
                
                // Ẩn messages cũ
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
                
                try {
                    const result = await authManager.login(email, password);
                    
                    if (result.success) {
                        successMessage.textContent = 'Đăng nhập thành công! Đang chuyển hướng...';
                        successMessage.style.display = 'block';
                        
                        // Chuyển về trang chủ sau 1 giây
                        setTimeout(() => {
                            window.location.href = 'index.html';
                        }, 1000);
                    } else {
                        errorMessage.textContent = result.error || 'Đăng nhập thất bại. Vui lòng kiểm tra lại email và mật khẩu.';
                        errorMessage.style.display = 'block';
                    }
                } catch (error) {
                    errorMessage.textContent = 'Lỗi kết nối server. Vui lòng thử lại sau.';
                    errorMessage.style.display = 'block';
                } finally {
                    // Enable nút lại
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Đăng nhập';
                }
            });
            
            // Xử lý link đăng ký
            document.getElementById('register-link').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Chức năng đăng ký sẽ được phát triển trong phiên bản tiếp theo.');
            });
            
            // Xử lý link quên mật khẩu
            document.getElementById('forgot-password-link').addEventListener('click', function(e) {
                e.preventDefault();
                alert('Chức năng khôi phục mật khẩu sẽ được phát triển trong phiên bản tiếp theo.');
            });
        });
    </script>
</body>
</html>
