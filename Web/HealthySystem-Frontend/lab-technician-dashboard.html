<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bác sĩ Xét nghiệm - Healthy System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #f093fb;
            --secondary-color: #f5576c;
            --accent-color: #e91e63;
            --success-color: #52c41a;
            --warning-color: #fa8c16;
        }

        body {
            background: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .page-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
            border-left: 4px solid;
            transition: all 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }

        .stat-card.total { border-left-color: #667eea; }
        .stat-card.pending { border-left-color: #fa8c16; }
        .stat-card.in-progress { border-left-color: #1890ff; }
        .stat-card.completed { border-left-color: #52c41a; }

        .stat-icon {
            font-size: 2.5rem;
            opacity: 0.8;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }

        .stat-label {
            color: #8c8c8c;
            font-size: 0.9rem;
        }

        .content-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #262626;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--primary-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .request-table {
            width: 100%;
        }

        .request-table th {
            background: #f5f5f5;
            font-weight: 600;
            padding: 0.75rem;
            border-bottom: 2px solid #e8e8e8;
        }

        .request-table td {
            padding: 0.75rem;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .request-table tr:hover {
            background: #fafafa;
        }

        .status-badge {
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-requested {
            background: #fff7e6;
            color: #fa8c16;
        }

        .status-in_progress {
            background: #e6f7ff;
            color: #1890ff;
        }

        .status-completed {
            background: #f6ffed;
            color: #52c41a;
        }

        .status-cancelled {
            background: #f0f0f0;
            color: #8c8c8c;
        }

        .btn-view {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.4rem 1rem;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .btn-view:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
        }

        .search-box {
            background: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .btn-logout {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s;
        }

        .btn-logout:hover {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .modal-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
        }

        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }

        .test-result-item {
            background: #fafafa;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            border-left: 3px solid var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #8c8c8c;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="page-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="h3 mb-0">
                        <i class="fas fa-flask me-2"></i>
                        Bác sĩ Xét nghiệm
                    </h1>
                    <p class="mb-0 mt-2 opacity-75" id="welcomeText">Quản lý yêu cầu và kết quả xét nghiệm</p>
                </div>
                <button class="btn btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-2"></i>
                    Đăng xuất
                </button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container">
        <!-- Statistics -->
        <div class="row">
            <div class="col-md-3 col-6 mb-3">
                <div class="stat-card total">
                    <div class="stat-icon text-primary">
                        <i class="fas fa-clipboard-list"></i>
                    </div>
                    <div class="stat-value" id="totalRequests">0</div>
                    <div class="stat-label">Tổng yêu cầu</div>
                </div>
            </div>
            <div class="col-md-3 col-6 mb-3">
                <div class="stat-card pending">
                    <div class="stat-icon" style="color: #fa8c16;">
                        <i class="fas fa-hourglass-half"></i>
                    </div>
                    <div class="stat-value" id="pendingRequests">0</div>
                    <div class="stat-label">Chờ xử lý</div>
                </div>
            </div>
            <div class="col-md-3 col-6 mb-3">
                <div class="stat-card in-progress">
                    <div class="stat-icon" style="color: #1890ff;">
                        <i class="fas fa-spinner"></i>
                    </div>
                    <div class="stat-value" id="inProgressRequests">0</div>
                    <div class="stat-label">Đang xử lý</div>
                </div>
            </div>
            <div class="col-md-3 col-6 mb-3">
                <div class="stat-card completed">
                    <div class="stat-icon" style="color: #52c41a;">
                        <i class="fas fa-check-circle"></i>
                    </div>
                    <div class="stat-value" id="completedRequests">0</div>
                    <div class="stat-label">Hoàn thành</div>
                </div>
            </div>
        </div>

        <!-- Search Box -->
        <div class="search-box">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Tên bệnh nhân</label>
                    <input type="text" class="form-control" id="searchPatient" placeholder="Nhập tên bệnh nhân">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Tên bác sĩ</label>
                    <input type="text" class="form-control" id="searchDoctor" placeholder="Nhập tên bác sĩ">
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Trạng thái</label>
                    <select class="form-select" id="searchStatus">
                        <option value="">Tất cả</option>
                        <option value="requested">Chờ xử lý</option>
                        <option value="in_progress">Đang xử lý</option>
                        <option value="completed">Hoàn thành</option>
                        <option value="cancelled">Đã hủy</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label small">Từ ngày</label>
                    <input type="date" class="form-control" id="searchFromDate">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-view w-100" onclick="searchRequests()">
                        <i class="fas fa-search me-1"></i> Tìm kiếm
                    </button>
                </div>
            </div>
        </div>

        <!-- Lab Requests Table -->
        <div class="content-card">
            <div class="section-title">
                <i class="fas fa-list-alt"></i>
                Danh sách yêu cầu xét nghiệm
            </div>
            
            <div id="requestsContainer">
                <div class="text-center py-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">Đang tải dữ liệu...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Request Detail Modal -->
    <div class="modal fade" id="requestDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-flask me-2"></i>
                        Chi tiết yêu cầu xét nghiệm
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="requestDetailContent">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>
    </div>

    <!-- Update Result Modal -->
    <div class="modal fade" id="updateResultModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-edit me-2"></i>
                        Nhập kết quả xét nghiệm
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateResultForm">
                        <input type="hidden" id="resultId">
                        <div class="mb-3">
                            <label class="form-label">Tên xét nghiệm</label>
                            <input type="text" class="form-control" id="testCode" readonly>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Giá trị</label>
                            <input type="text" class="form-control" id="resultValue" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Đơn vị</label>
                            <input type="text" class="form-control" id="resultUnits">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Khoảng bình thường</label>
                            <input type="text" class="form-control" id="normalRange">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mô tả kết quả</label>
                            <textarea class="form-control" id="resultText" rows="3"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="button" class="btn btn-view" onclick="submitResult()">
                        <i class="fas fa-save me-1"></i> Lưu kết quả
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_URL = 'http://localhost:5000/api';
        let currentRequestId = null;

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('token') || localStorage.getItem('healthysystem_token');
            
            if (!token) {
                window.location.href = 'login.html';
                return null;
            }

            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                const roleClaim = payload['http://schemas.microsoft.com/ws/2008/06/identity/claims/role'];
                const role = roleClaim || payload.role;
                
                if (role !== 'lab' && role !== 'admin') {
                    alert('Chỉ Bác sĩ xét nghiệm mới có quyền truy cập trang này!');
                    window.location.href = 'index.html';
                    return null;
                }
                
                // Update welcome text
                const nameClaim = payload['http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name'] || payload.name;
                if (nameClaim) {
                    document.getElementById('welcomeText').textContent = `Xin chào, ${nameClaim}`;
                }
                
                return token;
            } catch (error) {
                console.error('Invalid token:', error);
                localStorage.removeItem('token');
                localStorage.removeItem('healthysystem_token');
                window.location.href = 'login.html';
                return null;
            }
        }

        // Load statistics
        async function loadStatistics() {
            const token = checkAuth();
            if (!token) return;

            try {
                const response = await fetch(`${API_URL}/labtechnician/statistics`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to load statistics');

                const result = await response.json();
                const stats = result.data;

                document.getElementById('totalRequests').textContent = stats.TotalRequests || stats.totalRequests || 0;
                document.getElementById('pendingRequests').textContent = stats.PendingRequests || stats.pendingRequests || 0;
                document.getElementById('inProgressRequests').textContent = stats.InProgressRequests || stats.inProgressRequests || 0;
                document.getElementById('completedRequests').textContent = stats.CompletedRequests || stats.completedRequests || 0;
            } catch (error) {
                console.error('Error loading statistics:', error);
            }
        }

        // Load pending requests
        async function loadPendingRequests() {
            const token = checkAuth();
            if (!token) return;

            try {
                const response = await fetch(`${API_URL}/labtechnician/pending-requests`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to load requests');

                const result = await response.json();
                const requests = result.data || [];

                displayRequests(requests);
            } catch (error) {
                console.error('Error loading requests:', error);
                document.getElementById('requestsContainer').innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle text-danger"></i>
                        <h5>Có lỗi xảy ra</h5>
                        <p>Không thể tải danh sách yêu cầu</p>
                    </div>
                `;
            }
        }

        // Display requests
        function displayRequests(requests) {
            const container = document.getElementById('requestsContainer');

            if (requests.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox"></i>
                        <h5>Không có yêu cầu nào</h5>
                        <p>Chưa có yêu cầu xét nghiệm nào cần xử lý</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table class="request-table">
                    <thead>
                        <tr>
                            <th>Mã YC</th>
                            <th>Bệnh nhân</th>
                            <th>Bác sĩ</th>
                            <th>Ngày yêu cầu</th>
                            <th>Số lượng test</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            requests.forEach(req => {
                const requestedDate = new Date(req.RequestedAt || req.requestedAt);
                const statusClass = `status-${req.Status || req.status}`;
                const statusText = getStatusText(req.Status || req.status);
                const completedCount = req.CompletedTestCount || req.completedTestCount || 0;
                const totalCount = req.TestCount || req.testCount || 0;

                html += `
                    <tr>
                        <td><strong>#${req.Id || req.id}</strong></td>
                        <td>${req.PatientName || req.patientName}</td>
                        <td>${req.DoctorName || req.doctorName}</td>
                        <td>${requestedDate.toLocaleDateString('vi-VN')} ${requestedDate.toLocaleTimeString('vi-VN', {hour: '2-digit', minute: '2-digit'})}</td>
                        <td>${completedCount}/${totalCount}</td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>
                            <button class="btn btn-view btn-sm" onclick="viewRequestDetail(${req.Id || req.id})">
                                <i class="fas fa-eye"></i> Xem
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        // Get status text
        function getStatusText(status) {
            const statusMap = {
                'requested': 'Chờ xử lý',
                'in_progress': 'Đang xử lý',
                'completed': 'Hoàn thành',
                'cancelled': 'Đã hủy'
            };
            return statusMap[status] || status;
        }

        // View request detail
        async function viewRequestDetail(requestId) {
            const token = checkAuth();
            if (!token) return;

            currentRequestId = requestId;

            try {
                const response = await fetch(`${API_URL}/labtechnician/requests/${requestId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to load request detail');

                const result = await response.json();
                const request = result.data;

                displayRequestDetail(request);
                
                const modal = new bootstrap.Modal(document.getElementById('requestDetailModal'));
                modal.show();
            } catch (error) {
                console.error('Error loading request detail:', error);
                alert('Không thể tải chi tiết yêu cầu');
            }
        }

        // Display request detail
        function displayRequestDetail(request) {
            const patient = request.Patient || request.patient;
            const tests = request.LabTests || request.labTests || [];
            
            let html = `
                <div class="mb-3">
                    <h6><i class="fas fa-user text-primary me-2"></i>Thông tin bệnh nhân</h6>
                    <div class="row">
                        <div class="col-md-6">
                            <p class="mb-1"><strong>Họ tên:</strong> ${patient.FullName || patient.fullName}</p>
                            <p class="mb-1"><strong>Giới tính:</strong> ${patient.Gender === 'M' ? 'Nam' : patient.Gender === 'F' ? 'Nữ' : 'Khác'}</p>
                        </div>
                        <div class="col-md-6">
                            <p class="mb-1"><strong>Ngày sinh:</strong> ${new Date(patient.DateOfBirth || patient.dateOfBirth).toLocaleDateString('vi-VN')}</p>
                            <p class="mb-1"><strong>Điện thoại:</strong> ${patient.Phone || patient.phone || 'N/A'}</p>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <h6><i class="fas fa-user-md text-success me-2"></i>Bác sĩ yêu cầu</h6>
                    <p class="mb-1"><strong>${request.DoctorName || request.doctorName}</strong></p>
                    <p class="mb-1 text-muted small">Ngày yêu cầu: ${new Date(request.RequestedAt || request.requestedAt).toLocaleString('vi-VN')}</p>
                    ${request.Note || request.note ? `<p class="mb-0"><em>Ghi chú: ${request.Note || request.note}</em></p>` : ''}
                </div>

                <div class="mb-3">
                    <h6><i class="fas fa-flask text-danger me-2"></i>Danh sách xét nghiệm</h6>
            `;

            if (tests.length === 0) {
                html += '<p class="text-muted">Chưa có xét nghiệm nào</p>';
            } else {
                tests.forEach(test => {
                    const isCompleted = test.IsCompleted || test.isCompleted || (test.PerformedAt || test.performedAt);
                    html += `
                        <div class="test-result-item">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <h6 class="mb-2">${test.TestCode || test.testCode}</h6>
                                    ${isCompleted ? `
                                        <p class="mb-1"><strong>Kết quả:</strong> ${test.ResultValue || test.resultValue} ${test.Units || test.units || ''}</p>
                                        <p class="mb-1"><strong>Khoảng bình thường:</strong> ${test.NormalRange || test.normalRange || 'N/A'}</p>
                                        ${test.ResultText || test.resultText ? `<p class="mb-1"><strong>Mô tả:</strong> ${test.ResultText || test.resultText}</p>` : ''}
                                        <p class="mb-0 text-success small"><i class="fas fa-check-circle"></i> Đã hoàn thành: ${new Date(test.PerformedAt || test.performedAt).toLocaleString('vi-VN')}</p>
                                    ` : `
                                        <p class="mb-0 text-warning"><i class="fas fa-clock"></i> Chưa có kết quả</p>
                                    `}
                                </div>
                                ${!isCompleted ? `
                                    <button class="btn btn-sm btn-view" onclick="showUpdateResultModal(${test.Id || test.id}, '${test.TestCode || test.testCode}', '${test.Units || test.units || ''}', '${test.NormalRange || test.normalRange || ''}')">
                                        <i class="fas fa-edit"></i> Nhập KQ
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            }

            html += '</div>';

            // Add update status buttons
            html += `
                <div class="d-flex gap-2">
                    <button class="btn btn-warning" onclick="updateRequestStatus('in_progress')">
                        <i class="fas fa-spinner"></i> Đang xử lý
                    </button>
                    <button class="btn btn-success" onclick="updateRequestStatus('completed')">
                        <i class="fas fa-check-circle"></i> Hoàn thành
                    </button>
                </div>
            `;

            document.getElementById('requestDetailContent').innerHTML = html;
        }

        // Show update result modal
        function showUpdateResultModal(resultId, testCode, units, normalRange) {
            document.getElementById('resultId').value = resultId;
            document.getElementById('testCode').value = testCode;
            document.getElementById('resultValue').value = '';
            document.getElementById('resultUnits').value = units;
            document.getElementById('normalRange').value = normalRange;
            document.getElementById('resultText').value = '';

            const modal = new bootstrap.Modal(document.getElementById('updateResultModal'));
            modal.show();
        }

        // Submit result
        async function submitResult() {
            const token = checkAuth();
            if (!token) return;

            const resultId = document.getElementById('resultId').value;
            const resultValue = document.getElementById('resultValue').value;
            const resultUnits = document.getElementById('resultUnits').value;
            const normalRange = document.getElementById('normalRange').value;
            const resultText = document.getElementById('resultText').value;

            if (!resultValue) {
                alert('Vui lòng nhập giá trị kết quả');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/labtechnician/results/${resultId}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ResultValue: resultValue,
                        ResultText: resultText,
                        Units: resultUnits,
                        NormalRange: normalRange
                    })
                });

                if (!response.ok) throw new Error('Failed to update result');

                alert('Cập nhật kết quả thành công!');
                
                // Close modal
                bootstrap.Modal.getInstance(document.getElementById('updateResultModal')).hide();
                
                // Reload request detail
                if (currentRequestId) {
                    viewRequestDetail(currentRequestId);
                }
                
                // Reload statistics and requests
                loadStatistics();
                loadPendingRequests();
            } catch (error) {
                console.error('Error updating result:', error);
                alert('Không thể cập nhật kết quả');
            }
        }

        // Update request status
        async function updateRequestStatus(status) {
            const token = checkAuth();
            if (!token || !currentRequestId) return;

            try {
                const response = await fetch(`${API_URL}/labtechnician/requests/${currentRequestId}/status`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ Status: status })
                });

                if (!response.ok) throw new Error('Failed to update status');

                alert('Cập nhật trạng thái thành công!');
                
                // Reload
                loadStatistics();
                loadPendingRequests();
                bootstrap.Modal.getInstance(document.getElementById('requestDetailModal')).hide();
            } catch (error) {
                console.error('Error updating status:', error);
                alert('Không thể cập nhật trạng thái');
            }
        }

        // Search requests
        async function searchRequests() {
            const token = checkAuth();
            if (!token) return;

            const patientName = document.getElementById('searchPatient').value;
            const doctorName = document.getElementById('searchDoctor').value;
            const status = document.getElementById('searchStatus').value;
            const fromDate = document.getElementById('searchFromDate').value;

            let url = `${API_URL}/labtechnician/search?`;
            if (patientName) url += `patientName=${encodeURIComponent(patientName)}&`;
            if (doctorName) url += `doctorName=${encodeURIComponent(doctorName)}&`;
            if (status) url += `status=${status}&`;
            if (fromDate) url += `fromDate=${fromDate}&`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Failed to search');

                const result = await response.json();
                const requests = result.data || [];

                displayRequests(requests);
            } catch (error) {
                console.error('Error searching requests:', error);
                alert('Không thể tìm kiếm');
            }
        }

        // Logout
        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('healthysystem_token');
            window.location.href = 'login.html';
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            const token = checkAuth();
            if (token) {
                loadStatistics();
                loadPendingRequests();
            }
        });
    </script>
</body>
</html>
