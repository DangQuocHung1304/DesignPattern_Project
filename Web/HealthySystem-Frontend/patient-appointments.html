<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Khám Của Tôi - Healthy System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/notifications.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
        }

        .appointment-card {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .appointment-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }

        .appointment-card.status-scheduled {
            border-left-color: #0958d9;
        }

        .appointment-card.status-confirmed {
            border-left-color: #52c41a;
        }

        .appointment-card.status-pending {
            border-left-color: #fa8c16;
        }

        .appointment-card.status-cancelled {
            border-left-color: #cf1322;
            opacity: 0.7;
        }

        .appointment-card.status-completed {
            border-left-color: #595959;
            background: #f9f9f9;
        }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .status-scheduled { background: #e6f7ff; color: #0958d9; }
        .status-confirmed { background: #f6ffed; color: #52c41a; }
        .status-pending { background: #fff7e6; color: #fa8c16; }
        .status-cancelled { background: #fff1f0; color: #cf1322; }
        .status-completed { background: #f0f0f0; color: #595959; }

        .tab-btn {
            padding: 0.75rem 1.5rem;
            border: none;
            background: transparent;
            color: #718096;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: #718096;
        }

        .empty-state i {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #cbd5e0;
        }

        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .doctor-info {
            background: #f7fafc;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
        }

        .history-item {
            background: white;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            border: 1px solid #e2e8f0;
        }

        .history-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .info-label {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 0.25rem;
        }

        .info-value {
            color: #2d3748;
        }
    </style>
</head>
<body>
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-hospital me-2"></i>Healthy System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-home me-1"></i>Trang chủ
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="appointments.html">
                            <i class="fas fa-calendar-check me-1"></i>Đặt lịch khám
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="patient-appointments.html">
                            <i class="fas fa-calendar-alt me-1"></i>Lịch của tôi
                        </a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown">
                            <i class="fas fa-user-circle me-1"></i>
                            <span id="userName">Người dùng</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li><a class="dropdown-item" href="profile.html">
                                <i class="fas fa-user me-2"></i>Hồ sơ
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">
                                <i class="fas fa-sign-out-alt me-2"></i>Đăng xuất
                            </a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Page Header -->
    <div class="page-header">
        <div class="container">
            <h1 class="mb-2">
                <i class="fas fa-calendar-alt me-2"></i>Lịch Khám Của Tôi
            </h1>
            <p class="mb-0 opacity-75">Quản lý và theo dõi các lịch hẹn khám bệnh của bạn</p>
        </div>
    </div>

    <div class="container pb-5">
        <!-- Tabs -->
        <div class="bg-white rounded shadow-sm mb-4">
            <div class="d-flex border-bottom">
                <button class="tab-btn active" data-tab="upcoming" onclick="switchTab('upcoming')">
                    <i class="fas fa-calendar-day me-2"></i>Sắp tới
                </button>
                <button class="tab-btn" data-tab="history" onclick="switchTab('history')">
                    <i class="fas fa-history me-2"></i>Lịch sử
                </button>
                <button class="tab-btn" data-tab="cancelled" onclick="switchTab('cancelled')">
                    <i class="fas fa-times-circle me-2"></i>Đã hủy
                </button>
            </div>
        </div>

        <!-- Appointments List -->
        <div id="appointmentsList">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Đang tải dữ liệu...</p>
            </div>
        </div>
    </div>

    <!-- View Appointment Modal -->
    <div class="modal fade" id="viewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-info-circle me-2"></i>Chi tiết lịch hẹn
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="modalContent">
                    <!-- Will be populated by JavaScript -->
                </div>
                <div class="modal-footer" id="modalActions">
                    <!-- Will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <!-- Update Appointment Modal -->
    <div class="modal fade" id="updateModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">
                        <i class="fas fa-edit me-2"></i>Thay đổi lịch hẹn
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="updateForm">
                        <input type="hidden" id="updateAppointmentId">
                        
                        <div class="mb-3">
                            <label class="form-label">Ngày khám mới <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="newDate" required>
                        </div>

                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Giờ bắt đầu <span class="text-danger">*</span></label>
                                <input type="time" class="form-control" id="newStartTime" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Giờ kết thúc <span class="text-danger">*</span></label>
                                <input type="time" class="form-control" id="newEndTime" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Lý do thay đổi</label>
                            <textarea class="form-control" id="changeReason" rows="3" placeholder="Vui lòng cho biết lý do thay đổi lịch..."></textarea>
                        </div>

                        <div class="alert alert-info">
                            <i class="fas fa-info-circle me-2"></i>
                            Lịch hẹn mới cần được xác nhận bởi phòng khám
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="submitUpdate()">
                        <i class="fas fa-save me-2"></i>Lưu thay đổi
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/notifications.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
        let allAppointments = [];
        let currentTab = 'upcoming';
        let viewModal, updateModal;

        // Check authentication
        if (!isAuthenticated()) {
            window.location.href = 'login.html';
        }

        const user = getCurrentUser();
        document.getElementById('userName').textContent = user.fullName || 'Người dùng';

        // Initialize modals
        document.addEventListener('DOMContentLoaded', () => {
            viewModal = new bootstrap.Modal(document.getElementById('viewModal'));
            updateModal = new bootstrap.Modal(document.getElementById('updateModal'));
            
            loadAppointments();
        });

        async function loadAppointments() {
            loading.show('Đang tải danh sách lịch hẹn...');
            
            try {
                const result = await apiService.getAppointments();
                
                loading.hide();
                
                if (result.success && result.data) {
                    allAppointments = result.data;
                    displayAppointments(currentTab);
                } else {
                    showEmptyState('Không thể tải danh sách lịch hẹn');
                    notification.error('Không thể tải danh sách lịch hẹn');
                }
            } catch (error) {
                console.error('Error loading appointments:', error);
                loading.hide();
                showEmptyState('Đã xảy ra lỗi khi tải dữ liệu');
                notification.error('Đã xảy ra lỗi khi tải dữ liệu');
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            
            // Update active button
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
            
            displayAppointments(tab);
        }

        function displayAppointments(tab) {
            const container = document.getElementById('appointmentsList');
            const now = new Date();
            
            let filtered = [];
            
            switch(tab) {
                case 'upcoming':
                    filtered = allAppointments.filter(apt => 
                        (apt.status === 'scheduled' || apt.status === 'confirmed' || apt.status === 'pending') &&
                        new Date(apt.appointmentStart) >= now
                    );
                    break;
                case 'history':
                    filtered = allAppointments.filter(apt => 
                        apt.status === 'completed' || 
                        (apt.status !== 'cancelled' && new Date(apt.appointmentStart) < now)
                    );
                    break;
                case 'cancelled':
                    filtered = allAppointments.filter(apt => apt.status === 'cancelled');
                    break;
            }

            if (filtered.length === 0) {
                showEmptyState(getEmptyMessage(tab));
                return;
            }

            // Sort by date
            filtered.sort((a, b) => {
                if (tab === 'upcoming') {
                    return new Date(a.appointmentStart) - new Date(b.appointmentStart);
                } else {
                    return new Date(b.appointmentStart) - new Date(a.appointmentStart);
                }
            });

            container.innerHTML = filtered.map(apt => `
                <div class="appointment-card status-${apt.status}">
                    <div class="row">
                        <div class="col-md-8">
                            <div class="d-flex align-items-center gap-2 mb-3">
                                <h5 class="mb-0">
                                    <i class="fas fa-user-md text-primary me-2"></i>
                                    ${apt.doctor?.fullName || 'N/A'}
                                </h5>
                                <span class="status-badge status-${apt.status}">${getStatusText(apt.status)}</span>
                            </div>

                            ${apt.doctor?.title ? `
                                <div class="mb-2">
                                    <span class="badge bg-info">${apt.doctor.title}</span>
                                    ${apt.doctor.department ? `<span class="badge bg-secondary">${apt.doctor.department}</span>` : ''}
                                </div>
                            ` : ''}

                            ${apt.doctor?.specialties && apt.doctor.specialties.length > 0 ? `
                                <div class="mb-2">
                                    <i class="fas fa-stethoscope text-muted me-2"></i>
                                    ${apt.doctor.specialties.map(s => s.name).join(', ')}
                                </div>
                            ` : ''}

                            <div class="mb-2">
                                <i class="fas fa-calendar text-muted me-2"></i>
                                <strong>${formatDate(apt.appointmentStart)}</strong>
                            </div>

                            <div class="mb-2">
                                <i class="fas fa-clock text-muted me-2"></i>
                                ${formatTime(apt.appointmentStart)} - ${formatTime(apt.appointmentEnd)}
                            </div>

                            ${apt.notes ? `
                                <div class="mt-2 text-muted">
                                    <i class="fas fa-sticky-note me-2"></i>
                                    <em>${apt.notes}</em>
                                </div>
                            ` : ''}
                        </div>

                        <div class="col-md-4 text-end">
                            <div class="d-flex flex-column gap-2">
                                <button class="btn btn-outline-primary btn-sm" onclick="viewAppointment(${apt.id})">
                                    <i class="fas fa-eye me-2"></i>Xem chi tiết
                                </button>
                                
                                ${tab === 'upcoming' && apt.status !== 'cancelled' ? `
                                    <button class="btn btn-outline-warning btn-sm" onclick="openUpdateModal(${apt.id})">
                                        <i class="fas fa-edit me-2"></i>Thay đổi lịch
                                    </button>
                                    <button class="btn btn-outline-danger btn-sm" onclick="cancelAppointment(${apt.id})">
                                        <i class="fas fa-times me-2"></i>Hủy lịch
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function viewAppointment(appointmentId) {
            try {
                const result = await apiService.getAppointmentById(appointmentId);
                
                if (result.success && result.data) {
                    const apt = result.data;
                    
                    document.getElementById('modalContent').innerHTML = `
                        <div class="doctor-info">
                            <h6 class="mb-3"><i class="fas fa-user-md me-2"></i>Thông tin bác sĩ</h6>
                            <div class="row">
                                <div class="col-md-6 mb-2">
                                    <div class="info-label">Họ tên</div>
                                    <div class="info-value">${apt.doctor?.fullName || 'N/A'}</div>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <div class="info-label">Chức danh</div>
                                    <div class="info-value">${apt.doctor?.title || 'N/A'}</div>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <div class="info-label">Khoa</div>
                                    <div class="info-value">${apt.doctor?.department || 'N/A'}</div>
                                </div>
                                <div class="col-md-6 mb-2">
                                    <div class="info-label">Điện thoại</div>
                                    <div class="info-value">${apt.doctor?.phone || 'N/A'}</div>
                                </div>
                            </div>
                        </div>

                        <h6 class="mb-3"><i class="fas fa-calendar-alt me-2"></i>Thông tin lịch hẹn</h6>
                        <div class="row mb-3">
                            <div class="col-md-6 mb-2">
                                <div class="info-label">Trạng thái</div>
                                <div><span class="status-badge status-${apt.status}">${getStatusText(apt.status)}</span></div>
                            </div>
                            <div class="col-md-6 mb-2">
                                <div class="info-label">Mã lịch hẹn</div>
                                <div class="info-value">#${apt.id}</div>
                            </div>
                            <div class="col-md-6 mb-2">
                                <div class="info-label">Ngày khám</div>
                                <div class="info-value">${formatDate(apt.appointmentStart)}</div>
                            </div>
                            <div class="col-md-6 mb-2">
                                <div class="info-label">Thời gian</div>
                                <div class="info-value">${formatTime(apt.appointmentStart)} - ${formatTime(apt.appointmentEnd)}</div>
                            </div>
                        </div>

                        ${apt.notes ? `
                            <h6 class="mb-3"><i class="fas fa-sticky-note me-2"></i>Ghi chú</h6>
                            <p class="text-muted">${apt.notes}</p>
                        ` : ''}

                        <div class="alert alert-info mt-3">
                            <i class="fas fa-info-circle me-2"></i>
                            <strong>Lưu ý:</strong> Vui lòng đến trước giờ hẹn 15 phút để làm thủ tục
                        </div>
                    `;

                    let actions = '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>';
                    
                    if (apt.status !== 'cancelled' && apt.status !== 'completed' && new Date(apt.appointmentStart) >= new Date()) {
                        actions = `
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                            <button type="button" class="btn btn-warning" onclick="viewModal.hide(); openUpdateModal(${apt.id})">
                                <i class="fas fa-edit me-2"></i>Thay đổi lịch
                            </button>
                            <button type="button" class="btn btn-danger" onclick="viewModal.hide(); cancelAppointment(${apt.id})">
                                <i class="fas fa-times me-2"></i>Hủy lịch
                            </button>
                        `;
                    }

                    document.getElementById('modalActions').innerHTML = actions;
                    viewModal.show();
                }
            } catch (error) {
                console.error('Error viewing appointment:', error);
                alert('Không thể xem chi tiết lịch hẹn');
            }
        }

        function openUpdateModal(appointmentId) {
            const appointment = allAppointments.find(a => a.id === appointmentId);
            if (!appointment) return;

            document.getElementById('updateAppointmentId').value = appointmentId;
            
            const date = new Date(appointment.appointmentStart);
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            document.getElementById('newDate').value = tomorrow.toISOString().split('T')[0];
            document.getElementById('newDate').min = tomorrow.toISOString().split('T')[0];
            
            updateModal.show();
        }

        async function submitUpdate() {
            const form = document.getElementById('updateForm');
            if (!form.checkValidity()) {
                form.reportValidity();
                notification.warning('Vui lòng kiểm tra lại thông tin!');
                return;
            }

            const appointmentId = document.getElementById('updateAppointmentId').value;
            const reason = document.getElementById('changeReason').value;

            if (!confirm('Xác nhận thay đổi lịch hẹn? Lịch mới sẽ cần được xác nhận lại.')) return;

            loading.show('Đang gửi yêu cầu thay đổi lịch...');

            try {
                // Note: Backend API may need to be updated to support this
                const result = await apiService.updateAppointmentStatus(appointmentId, 'pending', reason);
                
                loading.hide();
                
                if (result.success) {
                    notification.success('Đã gửi yêu cầu thay đổi lịch! Vui lòng chờ xác nhận.');
                    updateModal.hide();
                    loadAppointments();
                } else {
                    notification.error('Không thể thay đổi lịch hẹn');
                }
            } catch (error) {
                console.error('Error updating appointment:', error);
                loading.hide();
                notification.error('Đã xảy ra lỗi khi thay đổi lịch hẹn');
            }
        }

        async function cancelAppointment(appointmentId) {
            if (!confirm('Bạn có chắc muốn hủy lịch hẹn này?')) return;
            
            loading.show('Đang hủy lịch hẹn...');
            
            try {
                const result = await apiService.cancelAppointment(appointmentId);
                
                loading.hide();
                
                if (result.success) {
                    notification.success('Đã hủy lịch hẹn thành công!');
                    loadAppointments();
                } else {
                    notification.error('Không thể hủy lịch hẹn');
                }
            } catch (error) {
                console.error('Error cancelling appointment:', error);
                loading.hide();
                notification.error('Đã xảy ra lỗi khi hủy lịch hẹn');
            }
        }

        function showEmptyState(message) {
            document.getElementById('appointmentsList').innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-calendar-times"></i>
                    <p>${message}</p>
                </div>
            `;
        }

        function getEmptyMessage(tab) {
            const messages = {
                'upcoming': 'Bạn chưa có lịch hẹn nào sắp tới',
                'history': 'Chưa có lịch sử khám bệnh',
                'cancelled': 'Không có lịch hẹn nào bị hủy'
            };
            return messages[tab] || 'Không có dữ liệu';
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN', { 
                weekday: 'long',
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric' 
            });
        }

        function formatTime(dateString) {
            if (!dateString) return 'N/A';
            const date = new Date(dateString);
            return date.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
        }

        function getStatusText(status) {
            const statusMap = {
                'scheduled': 'Đã đặt',
                'confirmed': 'Đã xác nhận',
                'pending': 'Chờ xác nhận',
                'cancelled': 'Đã hủy',
                'completed': 'Hoàn thành'
            };
            return statusMap[status] || status;
        }

        function logout() {
            if (confirm('Bạn có chắc muốn đăng xuất?')) {
                localStorage.removeItem(CONFIG.STORAGE_KEYS.TOKEN);
                localStorage.removeItem(CONFIG.STORAGE_KEYS.USER);
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
