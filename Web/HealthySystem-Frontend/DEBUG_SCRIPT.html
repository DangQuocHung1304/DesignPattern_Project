<!-- DEBUG SCRIPT - Thêm vào reception-appointments.html trước thẻ </body> -->
<script>
// Override console.error để bắt tất cả lỗi
const originalError = console.error;
console.error = function(...args) {
    originalError.apply(console, args);
    
    // Show error in alert for easy debugging
    if (args[0] && typeof args[0] === 'string') {
        if (args[0].includes('appointment') || args[0].includes('patient')) {
            alert('ERROR DETECTED:\n' + args.join('\n'));
        }
    }
};

// Add event listener to catch all errors
window.addEventListener('error', function(e) {
    console.log('=== GLOBAL ERROR CAUGHT ===');
    console.log('Message:', e.message);
    console.log('Source:', e.filename);
    console.log('Line:', e.lineno, 'Column:', e.colno);
    console.log('Error object:', e.error);
    console.log('===========================');
});

// Add unhandled promise rejection listener
window.addEventListener('unhandledrejection', function(e) {
    console.log('=== UNHANDLED PROMISE REJECTION ===');
    console.log('Reason:', e.reason);
    console.log('Promise:', e.promise);
    console.log('===================================');
});

console.log('✅ Debug script loaded - All errors will be logged!');
</script>
