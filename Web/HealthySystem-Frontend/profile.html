<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ của tôi - HealthySystem</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .profile-container {
            padding: 20px 0;
        }
        
        .profile-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow: hidden;
        }
        
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }
        
        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            font-size: 2.5rem;
            font-weight: bold;
            border: 3px solid white;
        }
        
        .profile-name {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .profile-subtitle {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .section-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            display: flex;
            flex-direction: column;
        }
        
        .info-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .info-value {
            font-size: 1rem;
            color: #333;
            font-weight: 500;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px dashed #dee2e6;
        }
        
        .empty-state i {
            font-size: 3rem;
            color: #adb5bd;
            margin-bottom: 15px;
        }
        
        .empty-state h4 {
            color: #6c757d;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }
        
        .empty-state p {
            color: #6c757d;
            margin: 0;
            font-size: 0.9rem;
        }
        
        .empty-state a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .empty-state a:hover {
            color: #5a6fd8;
            text-decoration: underline;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 10px;
        }
        
        .stat-number {
            display: block;
            font-size: 1.8rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            font-size: 0.85rem;
            color: #666;
            margin-top: 5px;
        }
        
        .back-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: rgba(255,255,255,0.3);
            color: white;
            text-decoration: none;
        }
        
        .back-btn i {
            margin-right: 8px;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            text-align: center;
            padding: 40px;
            color: #dc3545;
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .btn-outline-light {
            border: 1px solid rgba(255,255,255,0.5);
            color: white;
            transition: all 0.3s ease;
        }
        
        .btn-outline-light:hover {
            background: rgba(255,255,255,0.2);
            border-color: white;
            color: white;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="container">
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Quay lại trang chủ
            </a>
            
            <!-- Profile Header -->
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar" id="profile-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="profile-name" id="profile-name">Đang tải...</div>
                    <div class="profile-subtitle" id="profile-subtitle">Thành viên HealthySystem</div>
                    <div class="mt-3">
                        <button class="btn btn-success btn-sm me-2" onclick="updateProfile()">
                            <i class="fas fa-edit"></i> Cập nhật hồ sơ
                        </button>
                        <a href="patient-appointments.html" class="btn btn-primary btn-sm me-2">
                            <i class="fas fa-calendar-alt"></i> Lịch khám của tôi
                        </a>
                        <a href="guides.html" class="btn btn-info btn-sm me-2">
                            <i class="fas fa-book-medical"></i> Hướng dẫn khám bệnh
                        </a>
                        <button class="btn btn-outline-light btn-sm" onclick="logout()">
                            <i class="fas fa-sign-out-alt"></i> Đăng xuất
                        </button>
                    </div>
                </div>
                
                <!-- Statistics -->
                <div class="stats-grid">
                    <div class="stat-item">
                        <span class="stat-number" id="total-appointments">-</span>
                        <div class="stat-label">Lịch hẹn</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="completed-appointments">-</span>
                        <div class="stat-label">Đã hoàn thành</div>
                    </div>
                    <div class="stat-item">
                        <span class="stat-number" id="active-treatments">-</span>
                        <div class="stat-label">Liệu trình đang điều trị</div>
                    </div>
                </div>
            </div>
            
            <div class="row">
                <!-- Left Column -->
                <div class="col-lg-6">
                    <!-- Personal Information -->
                    <div class="section-card">
                        <div class="section-title">
                            <i class="fas fa-user-circle"></i> Thông tin cá nhân
                        </div>
                        <div id="personal-info" class="info-grid">
                            <div class="loading">Đang tải thông tin...</div>
                        </div>
                    </div>
                    
                    <!-- Medical History -->
                    <div class="section-card">
                        <div class="section-title">
                            <i class="fas fa-history"></i> Lịch sử khám bệnh
                        </div>
                        <div id="medical-history">
                            <div class="loading">Đang tải lịch sử khám bệnh...</div>
                        </div>
                    </div>
                </div>
                
                <!-- Right Column -->
                <div class="col-lg-6">
                    <!-- Current Treatments -->
                    <div class="section-card">
                        <div class="section-title">
                            <i class="fas fa-procedures"></i> Liệu trình điều trị
                        </div>
                        <div id="current-treatments">
                            <div class="loading">Đang tải liệu trình điều trị...</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Load required scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        class SimpleProfileService {
            constructor() {
                this.currentUser = null;
                this.init();
            }
            
            init() {
                console.log('Simple Profile Service initialized');
                this.loadProfile();
            }
            
            async loadProfile() {
                console.log('Loading profile...');
                
                // Check authentication
                if (!this.checkAuth()) {
                    console.log('Not authenticated, redirecting...');
                    window.location.href = 'login.html';
                    return;
                }
                
                // Get user data from localStorage first
                this.currentUser = this.getUserData();
                
                if (!this.currentUser) {
                    this.showError('Không tìm thấy thông tin người dùng. Vui lòng đăng nhập lại.');
                    return;
                }
                
                console.log('User data from localStorage:', this.currentUser);
                
                // Try to fetch fresh data from API
                await this.fetchUserDataFromAPI();
                
                // Load all sections
                this.loadPersonalInfo();
                this.loadMedicalHistory();
                this.loadCurrentTreatments();
                this.loadStatistics();
                
                console.log('Profile loaded successfully');
            }
            
            checkAuth() {
                // Check multiple storage keys
                const checks = [
                    localStorage.getItem('healthysystem_token') && localStorage.getItem('healthysystem_user'),
                    localStorage.getItem('authToken') && localStorage.getItem('user')
                ];
                
                return checks.some(check => check);
            }
            
            getUserData() {
                console.log('=== Getting User Data ===');
                
                // Try multiple sources
                let userData = null;
                
                // Try CONFIG keys first
                const configUser = localStorage.getItem('healthysystem_user');
                if (configUser) {
                    try {
                        userData = JSON.parse(configUser);
                        console.log('✅ Found user data in CONFIG storage:', userData);
                    } catch (e) {
                        console.error('❌ Error parsing CONFIG user data:', e);
                    }
                }
                
                // Try fallback keys
                if (!userData) {
                    const fallbackUser = localStorage.getItem('user');
                    if (fallbackUser) {
                        try {
                            userData = JSON.parse(fallbackUser);
                            console.log('✅ Found user data in fallback storage:', userData);
                        } catch (e) {
                            console.error('❌ Error parsing fallback user data:', e);
                        }
                    }
                }
                
                if (!userData) {
                    console.log('❌ No user data found in any storage');
                } else {
                    console.log('✅ Final user data to be used:', userData);
                    console.log('📋 User display name will be:', this.getDisplayNameFromData(userData));
                }
                
                return userData;
            }
            
            // Helper method to get display name from user data
            getDisplayNameFromData(userData) {
                if (userData.fullName) {
                    return userData.fullName;
                } else if (userData.firstName && userData.lastName) {
                    return `${userData.firstName} ${userData.lastName}`;
                } else if (userData.name) {
                    return userData.name;
                } else if (userData.email) {
                    return userData.email.split('@')[0];
                } else {
                    return 'Người dùng';
                }
            }
            
            async fetchUserDataFromAPI() {
                console.log('=== Fetching User Data from API ===');
                
                // For now, we'll only use localStorage data to show the actual logged-in user
                // This prevents showing mock data instead of the real user's information
                console.log('🔄 Using only localStorage data (not fetching from API)');
                console.log('📋 This ensures we show the actual logged-in user data, not mock data');
                console.log('⚡ When backend is ready, real API calls can be enabled here');
                
                return; // Skip API call for now to prevent mock data override
                
                // Future API implementation when backend is ready:
                // try {
                //     if (typeof apiService !== 'undefined') {
                //         const response = await apiService.getUserProfile();
                //         if (response && response.success && response.data) {
                //             console.log('Fresh user data from API:', response.data);
                //             this.currentUser = { ...this.currentUser, ...response.data };
                //             // Save updated data to localStorage
                //             const userDataString = JSON.stringify(this.currentUser);
                //             localStorage.setItem('healthysystem_user', userDataString);
                //             localStorage.setItem('user', userDataString);
                //         }
                //     }
                // } catch (error) {
                //     console.log('API not available, using localStorage');
                // }
            }
            
            loadPersonalInfo() {
                console.log('=== Loading Personal Info ===');
                console.log('Current user data:', this.currentUser);
                
                // Update header
                const displayName = this.getDisplayName();
                document.getElementById('profile-name').textContent = displayName;
                document.getElementById('profile-subtitle').textContent = 
                    `Thành viên từ ${this.formatDate(this.currentUser.memberSince || this.currentUser.createdAt || '2024-01-01')}`;
                
                // Update avatar
                const initials = this.getInitials();
                document.getElementById('profile-avatar').innerHTML = `<span>${initials}</span>`;
                
                // Create personal info grid - only show fields with actual data
                const personalInfo = document.getElementById('personal-info');
                let infoHTML = '';
                let fieldsWithData = 0;
                
                // Always show name 
                infoHTML += `
                    <div class="info-item">
                        <span class="info-label">Họ và tên</span>
                        <div class="info-value">${displayName}</div>
                    </div>
                `;
                fieldsWithData++;
                
                // Always show email if available
                if (this.currentUser.email) {
                    infoHTML += `
                        <div class="info-item">
                            <span class="info-label">Email</span>
                            <div class="info-value">${this.currentUser.email}</div>
                        </div>
                    `;
                    fieldsWithData++;
                }
                
                // Conditionally show other fields if they have meaningful data
                if (this.currentUser.phone && this.currentUser.phone.trim() !== '') {
                    infoHTML += `
                        <div class="info-item">
                            <span class="info-label">Số điện thoại</span>  
                            <div class="info-value">${this.currentUser.phone}</div>
                        </div>
                    `;
                    fieldsWithData++;
                }
                
                if (this.currentUser.gender && this.currentUser.gender.trim() !== '') {
                    infoHTML += `
                        <div class="info-item">
                            <span class="info-label">Giới tính</span>
                            <div class="info-value">${this.getGenderText(this.currentUser.gender)}</div>
                        </div>
                    `;
                    fieldsWithData++;
                }
                
                if (this.currentUser.dateOfBirth && this.currentUser.dateOfBirth.trim() !== '') {
                    infoHTML += `
                        <div class="info-item">
                            <span class="info-label">Ngày sinh</span>
                            <div class="info-value">${this.formatDate(this.currentUser.dateOfBirth)}</div>
                        </div>
                    `;
                    fieldsWithData++;
                }
                
                if (this.currentUser.address && this.currentUser.address.trim() !== '') {
                    infoHTML += `
                        <div class="info-item">
                            <span class="info-label">Địa chỉ</span>
                            <div class="info-value">${this.currentUser.address}</div>
                        </div>
                    `;
                    fieldsWithData++;
                }
                
                if (this.currentUser.bloodType && this.currentUser.bloodType.trim() !== '') {
                    infoHTML += `
                        <div class="info-item">
                            <span class="info-label">Nhóm máu</span>
                            <div class="info-value">${this.currentUser.bloodType}</div>
                        </div>
                    `;
                    fieldsWithData++;
                }
                
                if (this.currentUser.insurance && this.currentUser.insurance.trim() !== '') {
                    infoHTML += `
                        <div class="info-item">
                            <span class="info-label">Bảo hiểm y tế</span>
                            <div class="info-value">${this.currentUser.insurance}</div>
                        </div>
                    `;
                    fieldsWithData++;
                }
                
                // Show notification if profile is incomplete (less than 4 fields)
                if (fieldsWithData < 4) {
                    infoHTML += `
                        <div class="info-item" style="grid-column: 1 / -1;">
                            <div class="alert alert-info mt-3" style="margin: 0;">
                                <i class="fas fa-info-circle me-2"></i>
                                <strong>Hồ sơ chưa đầy đủ!</strong>
                                Bạn có thể bổ sung thêm thông tin để hồ sơ hoàn thiện hơn.
                                <button class="btn btn-sm btn-outline-primary ms-2" onclick="updateProfile()">
                                    <i class="fas fa-edit"></i> Cập nhật ngay
                                </button>
                            </div>
                        </div>
                    `;
                }
                
                personalInfo.innerHTML = infoHTML;
                
                console.log(`✅ Personal info loaded: ${fieldsWithData} fields with data`);
            }
            
            loadMedicalHistory() {
                console.log('Loading medical history...');
                
                const historyContainer = document.getElementById('medical-history');
                historyContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-calendar-times"></i>
                        <h4>Chưa có lịch sử khám bệnh</h4>
                        <p>Bạn chưa có lịch hẹn nào. <a href="index.html#services">Đặt lịch khám ngay</a></p>
                    </div>
                `;
                
                console.log('Medical history loaded (empty state)');
            }
            
            loadCurrentTreatments() {
                console.log('Loading current treatments...');
                
                const treatmentsContainer = document.getElementById('current-treatments');
                treatmentsContainer.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-procedures"></i>
                        <h4>Không có liệu trình điều trị</h4>
                        <p>Bạn hiện tại không có liệu trình điều trị nào đang diễn ra.</p>
                    </div>
                `;
                
                console.log('Current treatments loaded (empty state)');
            }
            
            loadStatistics() {
                console.log('Loading statistics...');
                
                // Set all stats to 0 since we have no data
                document.getElementById('total-appointments').textContent = '0';
                document.getElementById('completed-appointments').textContent = '0';
                document.getElementById('active-treatments').textContent = '0';
                
                console.log('Statistics loaded');
            }
            
            getDisplayName() {
                if (this.currentUser.fullName) {
                    return this.currentUser.fullName;
                } else if (this.currentUser.firstName && this.currentUser.lastName) {
                    return `${this.currentUser.firstName} ${this.currentUser.lastName}`;
                } else if (this.currentUser.name) {
                    return this.currentUser.name;
                } else if (this.currentUser.email) {
                    return this.currentUser.email.split('@')[0];
                } else {
                    return 'Người dùng';
                }
            }
            
            getInitials() {
                const name = this.getDisplayName();
                const parts = name.split(' ');
                if (parts.length >= 2) {
                    return `${parts[0].charAt(0)}${parts[parts.length-1].charAt(0)}`.toUpperCase();
                } else {
                    return name.charAt(0).toUpperCase();
                }
            }
            
            getGenderText(gender) {
                const genderMap = {
                    'male': 'Nam',
                    'female': 'Nữ',
                    'other': 'Khác'
                };
                return genderMap[gender] || 'Chưa cập nhật';
            }
            
            formatDate(dateString) {
                if (!dateString) return 'Chưa cập nhật';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('vi-VN');
                } catch (e) {
                    return 'Chưa cập nhật';
                }
            }
            
            showError(message) {
                document.body.innerHTML = `
                    <div class="container mt-5">
                        <div class="error">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h4>Lỗi</h4>
                            <p>${message}</p>
                            <a href="login.html" class="btn btn-primary">Đăng nhập lại</a>
                        </div>
                    </div>
                `;
            }
        }
        
        // Global logout function
        function logout() {
            try {
                console.log('Logging out...');
                
                // Clear localStorage
                if (typeof CONFIG !== 'undefined' && CONFIG.STORAGE_KEYS) {
                    localStorage.removeItem(CONFIG.STORAGE_KEYS.TOKEN);
                    localStorage.removeItem(CONFIG.STORAGE_KEYS.USER);
                }
                localStorage.removeItem('authToken');
                localStorage.removeItem('user');
                localStorage.removeItem('healthysystem_token');
                localStorage.removeItem('healthysystem_user');
                
                // Clear authManager if available
                if (typeof authManager !== 'undefined' && authManager.logout) {
                    authManager.logout();
                }
                
                console.log('Logout successful, redirecting...');
                
                // Redirect to home page
                window.location.href = 'index.html';
                
            } catch (error) {
                console.error('Error during logout:', error);
                // Still redirect even if there's an error
                window.location.href = 'index.html';
            }
        }
        
        // Global updateProfile function
        function updateProfile() {
            console.log('Update profile clicked');
            
            // For now, show a more helpful message
            if (confirm('Chức năng cập nhật hồ sơ sẽ được phát triển trong phiên bản tiếp theo.\n\nHiện tại bạn có thể liên hệ với admin để cập nhật thông tin.\n\nBạn có muốn tiếp tục sử dụng các tính năng khác không?')) {
                // Future implementation:
                // window.location.href = 'edit-profile.html';
                // or show modal for editing
                console.log('User acknowledged update profile feature');
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Profile page loaded');
            new SimpleProfileService();
        });
    </script>
</body>
</html>
